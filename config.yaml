# Default camera: use one of the slugs above (e.g. "scpierend" = Surf City Pier "T").
camera: "scpierend"

# Loop through ALL cameras? 0 = stay on 'camera' only.
# Set e.g. 600 to automatically switch to the next camera every 10 minutes
# (starts at the default camera, skips cameras that produce no stream).
camera_cycle_seconds: 0

# Optional initial URL. It can be the currently valid signed URL.
# If it expires, Playwright obtains a new one from the active camera page.
# initial_stream_url: "https://www.surfchex.com/hls/svfp/video1_stream.m3u8?st=83usYz-yTw53m_D0ORa4Tg&e={expires}"
# Surf T
# initial_stream_url: "https://www.surfchex.com/hls/scpierend/index.m3u8?st=X1BkDCBbTBleijPTBzMSTQ&e={expires}"
initial_stream_url: null

# Standard 64-bit VLC installation path.
vlc_path: "C:\\Program Files\\VideoLAN\\VLC\\vlc.exe"

# true = no visible Chrome window.
# false = useful for troubleshooting and for sites that behave differently headless.
headless: true

browser_profile_dir: "state/chromium-profile"

# After a URL is captured, the camera page is unloaded (about:blank) until the
# next refresh so its video/JS stop consuming CPU/GPU 24/7. Set false only if
# you ever have trouble capturing the URL.
park_page: true

# Only capture HLS requests matching this text.
stream_url_contains: "surfchex.com/hls/"

# Optional regex. Leave null unless you need tighter filtering.
# Example:
# stream_url_regex: "video1_stream\\.m3u8"
stream_url_regex: null

# How many seconds BEFORE the signed URL expires the app starts refreshing
# (reads the e=... timestamp from the URL). SurfChex signed URLs are valid
# ~10 minutes, so with 120 s the app fetches a fresh URL every ~8 minutes and
# always pushes a valid one to the OBS source. The app also caps the margin
# at ~25% of the URL lifetime so short URLs cannot cause a refresh loop.
refresh_before_seconds: 120

# Wait between recovery attempts.
retry_seconds: 10

# VLC process monitoring interval. Lower = more precise camera-switch timing
# (e.g. 2 s checks the 60 s rotation every 2 s); cost is negligible.
monitor_interval_seconds: 2

page_timeout_seconds: 60
capture_timeout_seconds: 45
network_idle_wait_seconds: 5

# VLC HLS/network buffering.
vlc_network_caching_ms: 1500

# Additional VLC command-line arguments.
vlc_extra_args:
  - "--no-one-instance"

# true  = also open the local VLC window to play the stream (old behavior).
# false = do NOT open VLC; the app only sends the URL to the OBS source.
vlc_player: false

log_file: "logs/surfchex-vlc.log"



obs:
  enabled: true
  host: "localhost"
  port: 4455
  password: ""                 # if you set one
  # OBS Studio executable, used to auto-start OBS if it is not running
  # (the app asks Y/n first). Leave "" to never auto-start.
  obs_path: "C:\\Program Files\\obs-studio\\bin\\64bit\\obs64.exe"
  source_name: "Fishing Pier"   # name of a VLC Video Source (or Media Source) in OBS;
                                # the app creates it automatically if it does not exist

  # Network cache (ms) for the OBS VLC source. Lower = the new camera starts
  # playing sooner after each switch (smoother rotation); too low may stutter
  # on slow connections. 0 = libvlc default.
  vlc_caching_ms: 500

  # Text overlay toggles. When true, the app keeps the OBS text sources
  # "Location", "Weather" and "Tide" (created automatically if missing) in
  # sync with the active camera: the location name, the weather and the tide.
  # Weather/tide are scraped from each camera page at most once per day.
  camera_location: true
  camera_weather: true
  camera_tide: true

  # Optional: force the OBS base (canvas) resolution on startup, e.g. to drop
  # GPU load from a 4K canvas down to 1080p (the video source is re-fitted to
  # the new canvas automatically). Leave "" to not touch OBS settings.
  canvas_resolution: ""
